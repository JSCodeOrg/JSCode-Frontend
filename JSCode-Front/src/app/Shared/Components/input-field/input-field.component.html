<div class="input-container" [ngClass]="{'input-primary': variant === 'primary', 'input-secondary': variant === 'secondary'}">
  <label class="input-label">{{ label }}</label>
  <div *ngIf="variant === 'primary'" class="input-icon-container">
    <mat-icon matPrefix>{{ icon }}</mat-icon>
    <input
      [type]="type"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [formControl]="inputControl" />
  </div>

  <!-- Variante sin ícono (secondary) -->
  <input *ngIf="variant === 'secondary'"
         [type]="type"
         [placeholder]="placeholder"
         [disabled]="disabled"
         [formControl]="inputControl" />
  
</div>
