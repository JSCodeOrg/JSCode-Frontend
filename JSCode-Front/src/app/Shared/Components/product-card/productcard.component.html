
<div class="product-card" (click)="navigateToDetail()">
  <!-- Tu contenido actual de la tarjeta -->
  <div class="product-image">
    <img [src]="product.imageUrl" [alt]="product.name">
  </div>
  <div class="product-info">
    <h3>{{ product.name }}</h3>
    <p>{{ product.price | currency }}</p>
  </div>
</div>
