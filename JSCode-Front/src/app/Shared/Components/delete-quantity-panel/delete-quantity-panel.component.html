
<div class="modal-container">
  <div class="icono-basura">
    🗑️
  </div>
  <p>Stock: {{ stock }}</p>

<app-input-field type="text" placeholder="Escriba la cantidad"

  <app-button class="button_primario" label="Eliminar" (click)="eliminar($event)"></app-button>
</div>
