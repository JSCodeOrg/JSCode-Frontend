
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Recuperar Contraseña</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      width: 60px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
    }

    p {
      margin: 10px 0 30px;
      color: #555;
    }

    label {
      display: block;
      text-align: left;
      font-weight: 500;
      margin-bottom: 8px;
      color: #333;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .btn-primary {
      background: linear-gradient(to right, #a96dd1, #5c2e91);
      border: none;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid #5c2e91;
      color: #5c2e91;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="https://via.placeholder.com/60x60?text=Logo" alt="Logo" class="logo" />
    <h2>Recuperar contraseña</h2>
    <p>Ingresa tu email para obtener un código de verificación</p>

    <form>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="Ingresa tu correo electrónico" required />

      <button type="submit" class="btn-primary">Enviar correo de recuperación</button>
      <button type="button" class="btn-secondary">Regresar a inicio de sesión</button>
    </form>
  </div>
</body>
</html>
