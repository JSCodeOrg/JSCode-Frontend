<body>
  <div class="container">
    <img src="https://i.ibb.co/8hMwzXh/image-removebg-preview-2-1-removebg-preview.png" alt="Logo" class="logo" />
    <h2>Recuperar contraseña</h2>
    <p>Ingresa tu email para obtener un código de verificación</p>

    <form>
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" placeholder="Ingresa tu correo electrónico" required />

      <button type="submit" class="btn-primary">Enviar correo de recuperación</button>
      <button type="button" class="btn-secondary" (click)="goLogin()">Regresar a inicio de sesión</button>
    </form>
  </div>
</body>
