<div class="modal-backdrop">
  <div class="profile-edit-container">
    <div class="sidebar">
      <img src="https://i.ibb.co/8hMwzXh/image-removebg-preview-2-1-removebg-preview.png" alt="Logo" class="logo" />
      <ul class="menu">
        <li class="active"><i class="icon-user"></i> Perfil</li>
        <li><i class="icon-settings"></i> Ajustes</li>
      </ul>
    </div>

    <div class="profile-content">
      <div class="profile-photo-section">
        <h3>Foto de perfil</h3>
        <div class="photo-actions">
          <img
            [src]="userData.fotoperfil || 'https://as2.ftcdn.net/v2/jpg/03/31/69/91/1000_F_331699188_lRpvqxO5QRtwOM05gR50ImaaJgBx68vi.jpg'"
            alt="Foto de perfil" />
          <div class="photo-buttons">
            <app-button label="Cambiar Foto" variant="primary" (click)="fileInput.click()"></app-button>
            <input type="file" #fileInput accept="image/*" style="display: none;" (change)="onFileSelected($event)">
            <app-button label="Eliminar Foto" variant="secondary" (click)="onDeletePhoto()"></app-button>
          </div>
        </div>
      </div>

      <div class="profile-form">
        <div class="name-fields">
          <app-input-field label="Nombre" variant="primary" [(value)]="userData.nombre"
            (valueChange)="onNameChange($event)" icon="person_pin"></app-input-field>

          <app-input-field label="Apellido" variant="primary" [(value)]="userData.apellido"
            (valueChange)="onLastNameChange($event)" icon="person_pin"></app-input-field>
        </div>
        <app-input-field label="Documento" variant="primary" type="number"
          [value]="userData.documento !== null ? userData.documento.toString() : ''"
          (valueChange)="onDocumentChange($event)" icon="person_pin"></app-input-field>

        <div class="contact-fields">
          <app-input-field label="Correo Electrónico" [(value)]="userData.email" variant="primary"
            (valueChange)="onEmailChange($event)" icon="email"></app-input-field>

          <app-input-field label="Teléfono" [(value)]="userData.telefono" variant="primary"
            (valueChange)="onPhoneChange($event)" icon="phone"></app-input-field>

        </div>
        
        <app-input-field label="Dirección" [(value)]="userData.direccion" variant="primary"
          (valueChange)="onDirectionChange($event)" icon="place"></app-input-field>

        <app-input-field label="Contraseña" placeholder="*********" ariant="primary"
          (valueChange)="onPasswordChange($event)" icon="lock"></app-input-field>

        <app-button label="Editar Información" variant="primary" (click)="editInfo()"></app-button>
      </div>
      <button class="close-button" (click)="onClose()">✖</button>
    </div>
  </div>
</div>
