<div class="profile-edit-container">
    <div class="sidebar">
      <img src="https://i.ibb.co/8hMwzXh/image-removebg-preview-2-1-removebg-preview.png" alt="Logo" class="logo" />
      <ul class="menu">
        <li class="active"><i class="icon-user"></i> Perfil</li>
        <li><i class="icon-settings"></i> Ajustes</li>
      </ul>
    </div>
  
    <div class="profile-content">
      <div class="profile-photo-section">
        <h3>Foto de perfil</h3>
        <div class="photo-actions">
          <img [src]="photoPreview || 'assets/default-profile.jpg'" alt="Foto de perfil" />
          <div class="photo-buttons">
            <button class="change-btn" (click)="onChangePhoto()">Cambiar foto</button>
            <button class="delete-btn" (click)="onDeletePhoto()">Eliminar foto</button>
          </div>
        </div>
      </div>
  
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="profile-form">
        <label for="firstName">Nombres</label>
        <input id="firstName" formControlName="firstName" type="text" />
  
        <label for="lastName">Apellidos</label>
        <input id="lastName" formControlName="lastName" type="text" />
  
        <label for="email">Correo Electrónico</label>
        <input id="email" formControlName="email" type="email" />
  
        <label for="password">Contraseña</label>
        <input id="password" formControlName="password" type="password" />
  
        <button type="submit" [disabled]="profileForm.invalid">Guardar cambios</button>
      </form>
    </div>
  </div>
  
  <style>
  .profile-edit-container {
    display: flex;
    background: #f7f2f2;
    height: 100vh;
    font-family: 'Segoe UI', sans-serif;
  }
  
  .sidebar {
    width: 220px;
    background: #ffffff;
    border-top-left-radius: 12px;
    border-bottom-left-radius: 12px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 2px solid #e0dede;
  }
  
  .logo {
    width: 100px;
    margin-bottom: 40px;
  }
  
  .menu {
    list-style: none;
    padding: 0;
    width: 100%;
  }
  
  .menu li {
    padding: 12px 20px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    font-weight: 500;
    color: #333;
  }
  
  .menu li.active {
    background: #e8e7fc;
    color: #5e3bea;
  }
  
  .profile-content {
    flex: 1;
    background: #ffffff;
    border-top-right-radius: 12px;
    border-bottom-right-radius: 12px;
    padding: 40px;
  }
  
  .profile-photo-section h3 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  
  .photo-actions {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 40px;
  }
  
  .photo-actions img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #ccc;
  }
  
  .photo-buttons {
    display: flex;
    gap: 12px;
  }
  
  .change-btn,
  .delete-btn {
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.3s ease;
  }
  
  .change-btn {
    background: #fff;
    border: 1px solid #333;
    color: #333;
  }
  
  .delete-btn {
    background: linear-gradient(to right, #9f5ceb, #503c9e);
    color: white;
  }
  
  .profile-form {
    display: flex;
    flex-direction: column;
  }
  
  .profile-form label {
    font-weight: 500;
    margin-top: 18px;
    margin-bottom: 6px;
  }
  
  .profile-form input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    outline: none;
  }
  
  .profile-form button[type="submit"] {
    margin-top: 30px;
    padding: 12px;
    border-radius: 6px;
    background: #5c4dff;
    color: white;
    border: none;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  
  .profile-form button[disabled] {
    background: #ccc;
    cursor: not-allowed;
  }
  </style>
