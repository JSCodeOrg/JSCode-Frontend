<div class="modal-backdrop">
  <div class="profile-edit-container">
    <div class="sidebar">
      <img src="https://i.ibb.co/8hMwzXh/image-removebg-preview-2-1-removebg-preview.png" alt="Logo" class="logo" />
      <ul class="menu">
        <li class="active"><i class="icon-user"></i> Perfil</li>
        <li><i class="icon-settings"></i> Ajustes</li>
      </ul>
    </div>

    <div class="profile-content">
      <div class="profile-photo-section">
        <h3>Foto de perfil</h3>
        <div class="photo-actions">
          <img [src]="this.userinfo.Fotoperfil ? this.userinfo.Fotoperfil : 'https://i.pinimg.com/236x/cd/b7/bd/cdb7bd75c577b47b1c9224e4908e4372.jpg' " alt="Foto de perfil" />
          <div class="photo-buttons">
            <app-button label="Cambiar Foto" variant="primary" (click)="onChangePhoto()"></app-button>
            <app-button label="Eliminar Foto" variant="secondary" (click)="onDeletePhoto()"></app-button>
          </div>
        </div>
      </div>

      <div class="profile-form">
        <div class="name-fields">
          <app-input-field label="Nombre" placeholder="{{this.userinfo.nombre}}" variant="primary" (valueChange)="onDocumentChange($event)"
            icon="person_pin"></app-input-field>

          <app-input-field label="Apellido" placeholder="{{this.userinfo.apellido}}" variant="primary" (valueChange)="onLastNameChange($event)"
            icon="person_pin"></app-input-field>
        </div>
        <app-input-field label="Documento" placeholder="{{this.userinfo.documento}}" variant="primary" (valueChange)="onDocumentChange($event)"
          icon="person_pin"></app-input-field>

        <div class="contact-fields">
          <app-input-field label="Correo Electrónico" placeholder="{{this.userinfo.email}}" variant="primary" (valueChange)="onEmailChange($event)"
            icon="email"></app-input-field>

          <app-input-field label="Teléfono"  placeholder="{{this.userinfo.telefono}}" variant="primary"
            (valueChange)="onPhoneChange($event)" icon="phone"></app-input-field>

        </div>
        <app-input-field label="Dirección" placeholder="{{this.userinfo.direccion}}" variant="primary" (valueChange)="onDocumentChange($event)"
          icon="place"></app-input-field>

        <app-input-field label="Contraseña" placeholder="**************"variant="primary" (valueChange)="onDocumentChange($event)"
          icon="lock"></app-input-field>



        <app-button label="Editar Información" variant="primary" (click)="editInfo()"></app-button>
      </div>
      <button class="close-button" (click)="onClose()">✖</button>
    </div>
  </div>
</div>
